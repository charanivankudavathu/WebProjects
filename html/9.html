<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Experiment 09</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>

<body>

<header class="site-header">
    <div class="container">
        <div class="header-inner">


        <a href="../index.html" class="logo">
            <div class="logo-mark">C</div>
            <div class="logo-text">
                <span class="logo-title">PRACTICAL LAB</span>
                <span class="logo-subtitle">HTML • CSS • JavaScript</span>
            </div>
        </a>

        <nav class="desktop-nav">
            <a href="../index.html">Home</a>
            <a href="index.html" class="active">HTML</a>
            <a href="../css/index.html">CSS</a>
            <a href="../javascript/index.html">JavaScript</a>
        </nav>

        <button class="menu-button" id="menuButton"
            aria-label="Open navigation menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

    <nav class="mobile-nav" id="mobileNav">
        <a href="../index.html">Home</a>
        <a href="index.html">HTML Programs</a>
        <a href="../css/index.html">CSS Programs</a>
        <a href="../javascript/index.html">JavaScript Programs</a>
    </nav>
</div>


</header>

<main class="experiment-wrapper">


<article class="experiment-card">

    <div class="experiment-header">
        <span class="eyebrow">HTML • Experiment 09</span>
        <h1>HTML5 Input Types</h1>
        <p>Demonstration of email, date, number and password input types.</p>
    </div>

    <div class="output-box">

        <form>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email">
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date">
            </div>

            <div class="form-group">
                <label for="number">Number</label>
                <input type="number" id="number" min="1" max="100">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-primary">
                Submit
            </button>

        </form>

    </div>

</article>


</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-inner">
            <div class="footer-text">© 2026 Practical Lab. HTML • CSS • JavaScript</div>
            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="index.html">HTML Programs</a>
            </div>
        </div>
    </div>
</footer>

<script>
const menuButton = document.getElementById("menuButton");
const mobileNav = document.getElementById("mobileNav");

menuButton.addEventListener("click", function () {
    mobileNav.classList.toggle("active");
    menuButton.setAttribute(
        "aria-expanded",
        mobileNav.classList.contains("active")
    );
});
</script>

</body>
</html>
