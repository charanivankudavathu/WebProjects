<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Experiment 05</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>

<body>

<header class="site-header">
    <div class="container">
        <div class="header-inner">

        <a href="../index.html" class="logo">
            <div class="logo-mark">C</div>
            <div class="logo-text">
                <span class="logo-title">PRACTICAL LAB</span>
                <span class="logo-subtitle">HTML • CSS • JavaScript</span>
            </div>
        </a>

        <nav class="desktop-nav">
            <a href="../index.html">Home</a>
            <a href="index.html" class="active">HTML</a>
            <a href="../css/index.html">CSS</a>
            <a href="../javascript/index.html">JavaScript</a>
        </nav>

        <button class="menu-button" id="menuButton"
            aria-label="Open navigation menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

    <nav class="mobile-nav" id="mobileNav">
        <a href="../index.html">Home</a>
        <a href="index.html">HTML Programs</a>
        <a href="../css/index.html">CSS Programs</a>
        <a href="../javascript/index.html">JavaScript Programs</a>
    </nav>
</div>

</header>

<main class="experiment-wrapper">

<article class="experiment-card">

    <div class="experiment-header">
        <span class="eyebrow">HTML • Experiment 05</span>
        <h1>Student Registration Form</h1>
        <p>Demonstration of HTML form elements used for student registration.</p>
    </div>

    <div class="output-box">

        <form>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
            </div>

            <div class="form-group">
                <label>Gender</label>

                <label>
                    <input type="radio" name="gender" value="male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="female">
                    Female
                </label>
            </div>

            <div class="form-group">
                <label for="course">Course</label>

                <select id="course" name="course">
                    <option value="">Select Course</option>
                    <option>Computer Science</option>
                    <option>Information Technology</option>
                    <option>Artificial Intelligence</option>
                </select>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="terms">
                    I agree to the terms and conditions.
                </label>
            </div>

            <button type="submit" class="btn btn-primary">
                Register
            </button>

            <button type="reset" class="btn btn-secondary">
                Reset
            </button>

        </form>

    </div>

</article>

</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-inner">
            <div class="footer-text">© 2026 Practical Lab. HTML • CSS • JavaScript</div>
            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="index.html">HTML Programs</a>
            </div>
        </div>
    </div>
</footer>

<script>
const menuButton = document.getElementById("menuButton");
const mobileNav = document.getElementById("mobileNav");

menuButton.addEventListener("click", function () {
    mobileNav.classList.toggle("active");
    menuButton.setAttribute(
        "aria-expanded",
        mobileNav.classList.contains("active")
    );
});
</script>

</body>
</html>
