<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Experiment 06</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>

<body>

<header class="site-header">
    <div class="container">
        <div class="header-inner">


        <a href="../index.html" class="logo">
            <div class="logo-mark">C</div>
            <div class="logo-text">
                <span class="logo-title">PRACTICAL LAB</span>
                <span class="logo-subtitle">HTML • CSS • JavaScript</span>
            </div>
        </a>

        <nav class="desktop-nav">
            <a href="../index.html">Home</a>
            <a href="index.html" class="active">HTML</a>
            <a href="../css/index.html">CSS</a>
            <a href="../javascript/index.html">JavaScript</a>
        </nav>

        <button class="menu-button" id="menuButton"
            aria-label="Open navigation menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

    <nav class="mobile-nav" id="mobileNav">
        <a href="../index.html">Home</a>
        <a href="index.html">HTML Programs</a>
        <a href="../css/index.html">CSS Programs</a>
        <a href="../javascript/index.html">JavaScript Programs</a>
    </nav>
</div>


</header>

<main class="experiment-wrapper">


<article class="experiment-card">

    <div class="experiment-header">
        <span class="eyebrow">HTML • Experiment 06</span>
        <h1>Audio and Video</h1>
        <p>Demonstration of HTML audio and video elements.</p>
    </div>

    <div class="output-box">

        <h2>Audio</h2>

        <audio controls>
            <source
                src="https://www.w3schools.com/html/horse.ogg"
                type="audio/ogg">
            Your browser does not support the audio element.
        </audio>

        <h2>Video</h2>

        <video controls width="100%" style="max-width:600px;">
            <source
                src="https://www.w3schools.com/html/mov_bbb.mp4"
                type="video/mp4">
            Your browser does not support the video element.
        </video>

    </div>

</article>

</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-inner">
            <div class="footer-text">© 2026 Practical Lab. HTML • CSS • JavaScript</div>
            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="index.html">HTML Programs</a>
            </div>
        </div>
    </div>
</footer>

<script>
const menuButton = document.getElementById("menuButton");
const mobileNav = document.getElementById("mobileNav");

menuButton.addEventListener("click", function () {
    mobileNav.classList.toggle("active");
    menuButton.setAttribute(
        "aria-expanded",
        mobileNav.classList.contains("active")
    );
});
</script>

</body>
</html>
