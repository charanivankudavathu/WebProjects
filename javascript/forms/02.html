<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM-02 | Login Form</title>
    <link rel="stylesheet" href="../../styles/main.css">

    <style>
        .form-demo {
            max-width: 550px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #999999;
            border-radius: 6px;
            font-size: 15px;
        }

        .error {
            display: block;
            margin-top: 5px;
            color: #cc0000;
            font-size: 14px;
        }

        .success {
            margin-top: 20px;
            padding: 15px;
            background: #eeeeee;
            border-radius: 8px;
            font-weight: 600;
        }

        .form-button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #111111;
            color: #ffffff;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">
        <div class="header-inner">

            <a href="../../index.html" class="logo">
                <div class="logo-mark">J</div>
                <div class="logo-text">
                    <span class="logo-title">PRACTICAL LAB</span>
                    <span class="logo-subtitle">HTML • CSS • JavaScript</span>
                </div>
            </a>

            <nav class="desktop-nav">
                <a href="../../index.html">Home</a>
                <a href="../../html/index.html">HTML</a>
                <a href="../../css/index.html">CSS</a>
                <a href="../index.html" class="active">JavaScript</a>
            </nav>

            <button class="menu-button" id="menuButton" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

        <nav class="mobile-nav" id="mobileNav">
            <a href="../../index.html">Home</a>
            <a href="../../html/index.html">HTML Programs</a>
            <a href="../../css/index.html">CSS Programs</a>
            <a href="../index.html">JavaScript Programs</a>
        </nav>
    </div>
</header>

<main class="experiment-wrapper">

    <article class="experiment-card">

        <div class="experiment-header">
            <span class="eyebrow">FORM-02</span>
            <h1>Login Form</h1>
            <p>Create a login form with username and password validation.</p>
        </div>

        <div class="form-demo">

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username">
                    <span class="error" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password">
                    <span class="error" id="passwordError"></span>
                </div>

                <button type="submit" class="form-button">
                    Login
                </button>

                <div id="loginMessage"></div>

            </form>

        </div>

    </article>

</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-inner">
            <div class="footer-text">
                © 2026 Practical Lab. HTML • CSS • JavaScript
            </div>

            <div class="footer-links">
                <a href="../../index.html">Home</a>
                <a href="../index.html">JavaScript Programs</a>
            </div>
        </div>
    </div>
</footer>

<script>
const menuButton = document.getElementById("menuButton");
const mobileNav = document.getElementById("mobileNav");

menuButton.addEventListener("click", function () {
    mobileNav.classList.toggle("active");

    menuButton.setAttribute(
        "aria-expanded",
        mobileNav.classList.contains("active")
    );
});

const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", function (event) {

    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    document.getElementById("usernameError").textContent = "";
    document.getElementById("passwordError").textContent = "";
    document.getElementById("loginMessage").textContent = "";
    document.getElementById("loginMessage").className = "";

    let valid = true;

    if (username === "") {
        document.getElementById("usernameError").textContent =
            "Username is required.";
        valid = false;
    } else if (username.length < 3) {
        document.getElementById("usernameError").textContent =
            "Username must contain at least 3 characters.";
        valid = false;
    }

    if (password === "") {
        document.getElementById("passwordError").textContent =
            "Password is required.";
        valid = false;
    } else if (password.length < 6) {
        document.getElementById("passwordError").textContent =
            "Password must contain at least 6 characters.";
        valid = false;
    }

    if (valid) {
        document.getElementById("loginMessage").textContent =
            "Login validation successful.";
        document.getElementById("loginMessage").className = "success";
    }
});
</script>

</body>
</html>
