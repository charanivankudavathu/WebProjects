<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JS-28 | Simple Calculator</title>

    <link rel="stylesheet" href="../styles/main.css">

    <style>
        .calculator {
            max-width: 420px;
            margin: 0 auto;
            padding: 25px;
            background: #eeeeee;
            border: 1px solid #555;
            border-radius: 12px;
        }

        #display {
            width: 100%;
            height: 65px;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #fff;
            font-size: 28px;
            text-align: right;
        }

        .calculator-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calculator-buttons button {
            height: 55px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }

        .calculator-buttons button:hover {
            background: #333;
        }

        .clear-button {
            grid-column: span 4;
        }

        @media (max-width: 480px) {
            .calculator {
                padding: 15px;
            }

            .calculator-buttons {
                gap: 7px;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">

        <div class="header-inner">

            <a href="../index.html" class="logo">
                <div class="logo-mark">J</div>

                <div class="logo-text">
                    <span class="logo-title">PRACTICAL LAB</span>
                    <span class="logo-subtitle">HTML • CSS • JavaScript</span>
                </div>
            </a>

            <nav class="desktop-nav">
                <a href="../index.html">Home</a>
                <a href="../html/index.html">HTML</a>
                <a href="../css/index.html">CSS</a>
                <a href="index.html" class="active">JavaScript</a>
            </nav>

            <button class="menu-button" id="menuButton" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

        <nav class="mobile-nav" id="mobileNav">
            <a href="../index.html">Home</a>
            <a href="../html/index.html">HTML Programs</a>
            <a href="../css/index.html">CSS Programs</a>
            <a href="index.html">JavaScript Programs</a>
        </nav>

    </div>
</header>

<main class="experiment-wrapper">

    <article class="experiment-card">

        <div class="experiment-header">
            <span class="eyebrow">JavaScript • Experiment 28</span>

            <h1>Simple Calculator</h1>

            <p>
                Create a simple calculator using HTML, CSS, and JavaScript.
            </p>
        </div>

        <div class="output-box">

            <div class="calculator">

                <input
                    type="text"
                    id="display"
                    value=""
                    readonly
                >

                <div class="calculator-buttons">

                    <button onclick="clearDisplay()">C</button>
                    <button onclick="deleteLast()">⌫</button>
                    <button onclick="appendValue('%')">%</button>
                    <button onclick="appendValue('/')">÷</button>

                    <button onclick="appendValue('7')">7</button>
                    <button onclick="appendValue('8')">8</button>
                    <button onclick="appendValue('9')">9</button>
                    <button onclick="appendValue('*')">×</button>

                    <button onclick="appendValue('4')">4</button>
                    <button onclick="appendValue('5')">5</button>
                    <button onclick="appendValue('6')">6</button>
                    <button onclick="appendValue('-')">−</button>

                    <button onclick="appendValue('1')">1</button>
                    <button onclick="appendValue('2')">2</button>
                    <button onclick="appendValue('3')">3</button>
                    <button onclick="appendValue('+')">+</button>

                    <button onclick="appendValue('0')">0</button>
                    <button onclick="appendValue('.')">.</button>
                    <button onclick="calculate()" style="grid-column: span 2;">
                        =
                    </button>

                    <button
                        class="clear-button"
                        onclick="clearDisplay()"
                    >
                        Clear
                    </button>

                </div>

            </div>

        </div>

    </article>

</main>

<footer class="site-footer">
    <div class="container">

        <div class="footer-inner">

            <div class="footer-text">
                © 2026 Practical Lab. HTML • CSS • JavaScript
            </div>

            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="index.html">JavaScript Programs</a>
            </div>

        </div>

    </div>
</footer>

<script>

    const display =
        document.getElementById("display");


    function appendValue(value) {

        display.value += value;

    }


    function clearDisplay() {

        display.value = "";

    }


    function deleteLast() {

        display.value =
            display.value.slice(0, -1);

    }


    function calculate() {

        if (display.value.trim() === "") {
            return;
        }

        try {

            const expression =
                display.value;

            if (!/^[0-9+\-*/%.() ]+$/.test(expression)) {
                throw new Error();
            }

            const answer =
                Function(
                    "return (" + expression + ")"
                )();

            display.value = answer;

        } catch {

            display.value = "Error";

        }

    }


    const menuButton =
        document.getElementById("menuButton");

    const mobileNav =
        document.getElementById("mobileNav");

    menuButton.addEventListener("click", function () {

        mobileNav.classList.toggle("active");

        menuButton.setAttribute(
            "aria-expanded",
            mobileNav.classList.contains("active")
        );

    });

</script>

</body>
</html>
