<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JS-35 | Stopwatch</title>

    <link rel="stylesheet" href="../styles/main.css">

    <style>
        .stopwatch {
            max-width: 650px;
            margin: 0 auto;
            text-align: center;
        }

        #display {
            padding: 35px 20px;
            margin-bottom: 25px;
            background: #111;
            color: #fff;
            border-radius: 12px;
            font-size: clamp(42px, 10vw, 75px);
            font-weight: 700;
            letter-spacing: 3px;
        }

        .stopwatch-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stopwatch-buttons button {
            padding: 12px 24px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .stopwatch-buttons button:hover {
            background: #333;
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">

        <div class="header-inner">

            <a href="../index.html" class="logo">
                <div class="logo-mark">J</div>

                <div class="logo-text">
                    <span class="logo-title">PRACTICAL LAB</span>
                    <span class="logo-subtitle">HTML • CSS • JavaScript</span>
                </div>
            </a>

            <nav class="desktop-nav">
                <a href="../index.html">Home</a>
                <a href="../html/index.html">HTML</a>
                <a href="../css/index.html">CSS</a>
                <a href="index.html" class="active">JavaScript</a>
            </nav>

            <button class="menu-button" id="menuButton" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

        <nav class="mobile-nav" id="mobileNav">
            <a href="../index.html">Home</a>
            <a href="../html/index.html">HTML Programs</a>
            <a href="../css/index.html">CSS Programs</a>
            <a href="index.html">JavaScript Programs</a>
        </nav>

    </div>
</header>

<main class="experiment-wrapper">

    <article class="experiment-card">

        <div class="experiment-header">
            <span class="eyebrow">JavaScript • Experiment 35</span>

            <h1>Stopwatch</h1>

            <p>
                Create a stopwatch with start, pause, and reset controls.
            </p>
        </div>

        <div class="output-box">

            <div class="stopwatch">

                <div id="display">
                    00:00:00
                </div>

                <div class="stopwatch-buttons">

                    <button onclick="startStopwatch()">
                        Start
                    </button>

                    <button onclick="pauseStopwatch()">
                        Pause
                    </button>

                    <button onclick="resetStopwatch()">
                        Reset
                    </button>

                </div>

            </div>

        </div>

    </article>

</main>

<footer class="site-footer">
    <div class="container">

        <div class="footer-inner">

            <div class="footer-text">
                © 2026 Practical Lab. HTML • CSS • JavaScript
            </div>

            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="index.html">JavaScript Programs</a>
            </div>

        </div>

    </div>
</footer>

<script>

    let seconds = 0;
    let timer = null;


    const display =
        document.getElementById("display");


    function updateDisplay() {

        const hours =
            Math.floor(seconds / 3600);

        const minutes =
            Math.floor((seconds % 3600) / 60);

        const remainingSeconds =
            seconds % 60;


        display.textContent =
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(remainingSeconds).padStart(2, "0");

    }


    function startStopwatch() {

        if (timer !== null) {
            return;
        }

        timer = setInterval(function() {

            seconds++;

            updateDisplay();

        }, 1000);

    }


    function pauseStopwatch() {

        clearInterval(timer);

        timer = null;

    }


    function resetStopwatch() {

        clearInterval(timer);

        timer = null;

        seconds = 0;

        updateDisplay();

    }


    const menuButton =
        document.getElementById("menuButton");

    const mobileNav =
        document.getElementById("mobileNav");

    menuButton.addEventListener("click", function() {

        mobileNav.classList.toggle("active");

        menuButton.setAttribute(
            "aria-expanded",
            mobileNav.classList.contains("active")
        );

    });

</script>

</body>
</html>
