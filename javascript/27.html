<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JS-27 | Digital Clock</title>

    <link rel="stylesheet" href="../styles/main.css">

    <style>
        .clock-container {
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }

        #clock {
            padding: 35px 20px;
            background: #111;
            color: #fff;
            border-radius: 12px;
            font-size: clamp(40px, 10vw, 80px);
            font-weight: 700;
            letter-spacing: 4px;
        }

        #date {
            margin-top: 20px;
            font-size: 20px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">

        <div class="header-inner">

            <a href="../index.html" class="logo">
                <div class="logo-mark">J</div>

                <div class="logo-text">
                    <span class="logo-title">PRACTICAL LAB</span>
                    <span class="logo-subtitle">HTML • CSS • JavaScript</span>
                </div>
            </a>

            <nav class="desktop-nav">
                <a href="../index.html">Home</a>
                <a href="../html/index.html">HTML</a>
                <a href="../css/index.html">CSS</a>
                <a href="index.html" class="active">JavaScript</a>
            </nav>

            <button class="menu-button" id="menuButton" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

        <nav class="mobile-nav" id="mobileNav">
            <a href="../index.html">Home</a>
            <a href="../html/index.html">HTML Programs</a>
            <a href="../css/index.html">CSS Programs</a>
            <a href="index.html">JavaScript Programs</a>
        </nav>

    </div>
</header>

<main class="experiment-wrapper">

    <article class="experiment-card">

        <div class="experiment-header">
            <span class="eyebrow">JavaScript • Experiment 27</span>

            <h1>Digital Clock</h1>

            <p>
                Create a digital clock using JavaScript.
            </p>
        </div>

        <div class="output-box">

            <div class="clock-container">

                <div id="clock">
                    00:00:00
                </div>

                <div id="date">
                    Loading date...
                </div>

            </div>

        </div>

    </article>

</main>

<footer class="site-footer">
    <div class="container">

        <div class="footer-inner">

            <div class="footer-text">
                © 2026 Practical Lab. HTML • CSS • JavaScript
            </div>

            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="index.html">JavaScript Programs</a>
            </div>

        </div>

    </div>
</footer>

<script>

    function updateClock() {

        const now = new Date();

        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();

        const period = hours >= 12 ? "PM" : "AM";

        hours = hours % 12;

        if (hours === 0) {
            hours = 12;
        }

        hours = String(hours).padStart(2, "0");
        minutes = String(minutes).padStart(2, "0");
        seconds = String(seconds).padStart(2, "0");

        document.getElementById("clock").textContent =
            hours + ":" + minutes + ":" + seconds + " " + period;


        document.getElementById("date").textContent =
            now.toLocaleDateString(undefined, {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            });
    }

    updateClock();

    setInterval(updateClock, 1000);


    const menuButton =
        document.getElementById("menuButton");

    const mobileNav =
        document.getElementById("mobileNav");

    menuButton.addEventListener("click", function () {

        mobileNav.classList.toggle("active");

        menuButton.setAttribute(
            "aria-expanded",
            mobileNav.classList.contains("active")
        );

    });

</script>

</body>
</html>
