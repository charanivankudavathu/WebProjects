<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT-09 | Tic-Tac-Toe</title>
    <link rel="stylesheet" href="../../styles/main.css">

    <style>
        .game-demo {
            text-align: center;
        }

        .board {
            width: 320px;
            max-width: 100%;
            margin: 25px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cell {
            height: 100px;
            border: 1px solid #999999;
            background: #eeeeee;
            font-size: 35px;
            font-weight: 700;
            cursor: pointer;
        }

        .game-demo button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #111111;
            color: #ffffff;
            cursor: pointer;
        }

        #status {
            font-weight: 700;
            font-size: 18px;
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">
        <div class="header-inner">

            <a href="../../index.html" class="logo">
                <div class="logo-mark">J</div>
                <div class="logo-text">
                    <span class="logo-title">PRACTICAL LAB</span>
                    <span class="logo-subtitle">HTML • CSS • JavaScript</span>
                </div>
            </a>

            <nav class="desktop-nav">
                <a href="../../index.html">Home</a>
                <a href="../../html/index.html">HTML</a>
                <a href="../../css/index.html">CSS</a>
                <a href="../index.html" class="active">JavaScript</a>
            </nav>

            <button class="menu-button" id="menuButton" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>

        </div>

        <nav class="mobile-nav" id="mobileNav">
            <a href="../../index.html">Home</a>
            <a href="../../html/index.html">HTML Programs</a>
            <a href="../../css/index.html">CSS Programs</a>
            <a href="../index.html">JavaScript Programs</a>
        </nav>
    </div>
</header>

<main class="experiment-wrapper">

    <article class="experiment-card">

        <div class="experiment-header">
            <span class="eyebrow">PROJECT-09</span>
            <h1>Tic-Tac-Toe Game</h1>
            <p>Play a two-player Tic-Tac-Toe game.</p>
        </div>

        <div class="game-demo">

            <div id="status">Player X's Turn</div>

            <div class="board" id="board">

                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>

            </div>

            <button id="resetButton">
                Restart Game
            </button>

        </div>

    </article>

</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-inner">
            <div class="footer-text">
                © 2026 Practical Lab. HTML • CSS • JavaScript
            </div>
            <div class="footer-links">
                <a href="../../index.html">Home</a>
                <a href="../index.html">JavaScript Programs</a>
            </div>
        </div>
    </div>
</footer>

<script>
const menuButton = document.getElementById("menuButton");
const mobileNav = document.getElementById("mobileNav");

menuButton.addEventListener("click", function () {
    mobileNav.classList.toggle("active");

    menuButton.setAttribute(
        "aria-expanded",
        mobileNav.classList.contains("active")
    );
});

const cells = document.querySelectorAll(".cell");
const status = document.getElementById("status");

let currentPlayer = "X";
let gameOver = false;

const winningPatterns = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],
    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],
    [0, 4, 8],
    [2, 4, 6]
];

cells.forEach(function (cell) {

    cell.addEventListener("click", function () {

        if (cell.textContent !== "" || gameOver) {
            return;
        }

        cell.textContent = currentPlayer;

        checkWinner();

        if (!gameOver) {

            currentPlayer =
                currentPlayer === "X" ? "O" : "X";

            status.textContent =
                `Player ${currentPlayer}'s Turn`;
        }

    });

});

function checkWinner() {

    const values = Array.from(cells).map(function (cell) {
        return cell.textContent;
    });

    for (const pattern of winningPatterns) {

        const [a, b, c] = pattern;

        if (
            values[a] &&
            values[a] === values[b] &&
            values[a] === values[c]
        ) {

            status.textContent =
                `Player ${values[a]} Wins!`;

            gameOver = true;
            return;
        }
    }

    if (values.every(function (value) {
        return value !== "";
    })) {

        status.textContent = "Game Draw!";
        gameOver = true;
    }
}

document.getElementById("resetButton").addEventListener("click", function () {

    cells.forEach(function (cell) {
        cell.textContent = "";
    });

    currentPlayer = "X";
    gameOver = false;

    status.textContent = "Player X's Turn";

});
</script>

</body>
</html>
