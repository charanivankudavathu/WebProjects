<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT-04 | Countdown Timer</title>
    <link rel="stylesheet" href="../../styles/main.css">

    <style>
        .timer-demo {
            max-width: 650px;
            margin: auto;
            text-align: center;
        }

        .timer-demo input {
            padding: 12px;
            width: 220px;
            border: 1px solid #999999;
            border-radius: 6px;
        }

        .timer-demo button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 6px;
            background: #111111;
            color: #ffffff;
            cursor: pointer;
        }

        #display {
            margin: 30px 0;
            font-size: 60px;
            font-weight: 700;
        }

        #message {
            font-weight: 600;
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">
        <div class="header-inner">

            <a href="../../index.html" class="logo">
                <div class="logo-mark">J</div>
                <div class="logo-text">
                    <span class="logo-title">PRACTICAL LAB</span>
                    <span class="logo-subtitle">HTML • CSS • JavaScript</span>
                </div>
            </a>

            <nav class="desktop-nav">
                <a href="../../index.html">Home</a>
                <a href="../../html/index.html">HTML</a>
                <a href="../../css/index.html">CSS</a>
                <a href="../index.html" class="active">JavaScript</a>
            </nav>

            <button class="menu-button" id="menuButton" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>

        </div>

        <nav class="mobile-nav" id="mobileNav">
            <a href="../../index.html">Home</a>
            <a href="../../html/index.html">HTML Programs</a>
            <a href="../../css/index.html">CSS Programs</a>
            <a href="../index.html">JavaScript Programs</a>
        </nav>
    </div>
</header>

<main class="experiment-wrapper">

    <article class="experiment-card">

        <div class="experiment-header">
            <span class="eyebrow">PROJECT-04</span>
            <h1>Countdown Timer</h1>
            <p>Create a countdown timer using JavaScript.</p>
        </div>

        <div class="timer-demo">

            <input
                type="number"
                id="minutes"
                min="1"
                placeholder="Minutes"
            >

            <button id="startButton">Start</button>
            <button id="pauseButton">Pause</button>
            <button id="resetButton">Reset</button>

            <div id="display">00:00</div>

            <div id="message"></div>

        </div>

    </article>

</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-inner">
            <div class="footer-text">
                © 2026 Practical Lab. HTML • CSS • JavaScript
            </div>
            <div class="footer-links">
                <a href="../../index.html">Home</a>
                <a href="../index.html">JavaScript Programs</a>
            </div>
        </div>
    </div>
</footer>

<script>
const menuButton = document.getElementById("menuButton");
const mobileNav = document.getElementById("mobileNav");

menuButton.addEventListener("click", function () {
    mobileNav.classList.toggle("active");

    menuButton.setAttribute(
        "aria-expanded",
        mobileNav.classList.contains("active")
    );
});

let totalSeconds = 0;
let timer = null;

function updateDisplay() {

    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    document.getElementById("display").textContent =
        `${String(minutes).padStart(2, "0")}:` +
        `${String(seconds).padStart(2, "0")}`;
}

document.getElementById("startButton").addEventListener("click", function () {

    if (timer !== null) {
        return;
    }

    if (totalSeconds === 0) {

        const minutes =
            Number(document.getElementById("minutes").value);

        if (!minutes || minutes < 1) {
            document.getElementById("message").textContent =
                "Enter a valid number of minutes.";
            return;
        }

        totalSeconds = minutes * 60;
    }

    document.getElementById("message").textContent = "";

    timer = setInterval(function () {

        if (totalSeconds > 0) {

            totalSeconds--;
            updateDisplay();

        } else {

            clearInterval(timer);
            timer = null;

            document.getElementById("message").textContent =
                "Time is up!";

        }

    }, 1000);

});

document.getElementById("pauseButton").addEventListener("click", function () {

    clearInterval(timer);
    timer = null;

});

document.getElementById("resetButton").addEventListener("click", function () {

    clearInterval(timer);
    timer = null;
    totalSeconds = 0;

    document.getElementById("minutes").value = "";
    document.getElementById("message").textContent = "";

    updateDisplay();

});
</script>

</body>
</html>
