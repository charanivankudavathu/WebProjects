<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT-13 | Notes Application</title>
    <link rel="stylesheet" href="../../styles/main.css">

    <style>
        .notes-demo {
            max-width: 800px;
            margin: auto;
        }

        .notes-input {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notes-input input,
        .notes-input textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #999999;
            border-radius: 6px;
        }

        .notes-input textarea {
            min-height: 120px;
            resize: vertical;
        }

        .notes-input button {
            align-self: flex-start;
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            background: #111111;
            color: #ffffff;
            cursor: pointer;
        }

        #notesList {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .note {
            padding: 20px;
            border: 1px solid #cccccc;
            border-radius: 8px;
        }

        .note h3 {
            margin-bottom: 10px;
        }

        .note button {
            margin-top: 15px;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 650px) {
            #notesList {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">
        <div class="header-inner">

            <a href="../../index.html" class="logo">
                <div class="logo-mark">J</div>
                <div class="logo-text">
                    <span class="logo-title">PRACTICAL LAB</span>
                    <span class="logo-subtitle">HTML • CSS • JavaScript</span>
                </div>
            </a>

            <nav class="desktop-nav">
                <a href="../../index.html">Home</a>
                <a href="../../html/index.html">HTML</a>
                <a href="../../css/index.html">CSS</a>
                <a href="../index.html" class="active">JavaScript</a>
            </nav>

            <button class="menu-button" id="menuButton" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>

        </div>

        <nav class="mobile-nav" id="mobileNav">
            <a href="../../index.html">Home</a>
            <a href="../../html/index.html">HTML Programs</a>
            <a href="../../css/index.html">CSS Programs</a>
            <a href="../index.html">JavaScript Programs</a>
        </nav>
    </div>
</header>

<main class="experiment-wrapper">

    <article class="experiment-card">

        <div class="experiment-header">
            <span class="eyebrow">PROJECT-13</span>
            <h1>Notes Application</h1>
            <p>Create and save notes using localStorage.</p>
        </div>

        <div class="notes-demo">

            <div class="notes-input">

                <input
                    type="text"
                    id="titleInput"
                    placeholder="Note title"
                >

                <textarea
                    id="contentInput"
                    placeholder="Write your note..."
                ></textarea>

                <button id="saveButton">
                    Save Note
                </button>

            </div>

            <div id="notesList"></div>

        </div>

    </article>

</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-inner">
            <div class="footer-text">
                © 2026 Practical Lab. HTML • CSS • JavaScript
            </div>
            <div class="footer-links">
                <a href="../../index.html">Home</a>
                <a href="../index.html">JavaScript Programs</a>
            </div>
        </div>
    </div>
</footer>

<script>
const menuButton = document.getElementById("menuButton");
const mobileNav = document.getElementById("mobileNav");

menuButton.addEventListener("click", function () {
    mobileNav.classList.toggle("active");

    menuButton.setAttribute(
        "aria-expanded",
        mobileNav.classList.contains("active")
    );
});

let notes =
    JSON.parse(localStorage.getItem("notes")) || [];

function saveNotes() {
    localStorage.setItem(
        "notes",
        JSON.stringify(notes)
    );
}

function displayNotes() {

    const notesList =
        document.getElementById("notesList");

    notesList.innerHTML = "";

    if (notes.length === 0) {

        notesList.textContent =
            "No notes available.";

        return;
    }

    notes.forEach(function (note, index) {

        const div = document.createElement("div");

        div.className = "note";

        div.innerHTML = `
            <h3>${note.title}</h3>
            <p>${note.content}</p>
            <button onclick="deleteNote(${index})">
                Delete
            </button>
        `;

        notesList.appendChild(div);

    });
}

document.getElementById("saveButton").addEventListener("click", function () {

    const title =
        document.getElementById("titleInput").value.trim();

    const content =
        document.getElementById("contentInput").value.trim();

    if (title === "" || content === "") {

        alert("Enter both title and note content.");
        return;
    }

    notes.push({
        title: title,
        content: content
    });

    saveNotes();
    displayNotes();

    document.getElementById("titleInput").value = "";
    document.getElementById("contentInput").value = "";

});

function deleteNote(index) {

    notes.splice(index, 1);

    saveNotes();
    displayNotes();
}

displayNotes();
</script>

</body>
</html>
