<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JS-34 | Counter Application</title>

    <link rel="stylesheet" href="../styles/main.css">

    <style>
        .counter {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        #count {
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid #555;
            border-radius: 12px;
            background: #eeeeee;
            font-size: 70px;
            font-weight: 700;
        }

        .counter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .counter-buttons button {
            padding: 13px 25px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .counter-buttons button:hover {
            background: #333;
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">

        <div class="header-inner">

            <a href="../index.html" class="logo">
                <div class="logo-mark">J</div>

                <div class="logo-text">
                    <span class="logo-title">PRACTICAL LAB</span>
                    <span class="logo-subtitle">HTML • CSS • JavaScript</span>
                </div>
            </a>

            <nav class="desktop-nav">
                <a href="../index.html">Home</a>
                <a href="../html/index.html">HTML</a>
                <a href="../css/index.html">CSS</a>
                <a href="index.html" class="active">JavaScript</a>
            </nav>

            <button class="menu-button" id="menuButton" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

        <nav class="mobile-nav" id="mobileNav">
            <a href="../index.html">Home</a>
            <a href="../html/index.html">HTML Programs</a>
            <a href="../css/index.html">CSS Programs</a>
            <a href="index.html">JavaScript Programs</a>
        </nav>

    </div>
</header>

<main class="experiment-wrapper">

    <article class="experiment-card">

        <div class="experiment-header">
            <span class="eyebrow">JavaScript • Experiment 34</span>

            <h1>Counter Application</h1>

            <p>
                Increment, decrement, and reset a counter using JavaScript.
            </p>
        </div>

        <div class="output-box">

            <div class="counter">

                <div id="count">
                    0
                </div>

                <div class="counter-buttons">

                    <button onclick="decrement()">
                        − Decrement
                    </button>

                    <button onclick="resetCounter()">
                        Reset
                    </button>

                    <button onclick="increment()">
                        + Increment
                    </button>

                </div>

            </div>

        </div>

    </article>

</main>

<footer class="site-footer">
    <div class="container">

        <div class="footer-inner">

            <div class="footer-text">
                © 2026 Practical Lab. HTML • CSS • JavaScript
            </div>

            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="index.html">JavaScript Programs</a>
            </div>

        </div>

    </div>
</footer>

<script>

    let counter = 0;

    const countDisplay =
        document.getElementById("count");


    function updateCounter() {

        countDisplay.textContent =
            counter;

    }


    function increment() {

        counter++;

        updateCounter();

    }


    function decrement() {

        counter--;

        updateCounter();

    }


    function resetCounter() {

        counter = 0;

        updateCounter();

    }


    const menuButton =
        document.getElementById("menuButton");

    const mobileNav =
        document.getElementById("mobileNav");

    menuButton.addEventListener("click", function() {

        mobileNav.classList.toggle("active");

        menuButton.setAttribute(
            "aria-expanded",
            mobileNav.classList.contains("active")
        );

    });

</script>

</body>
</html>
