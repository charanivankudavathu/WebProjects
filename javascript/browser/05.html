<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROWSER-05 | localStorage</title>
    <link rel="stylesheet" href="../../styles/main.css">

    <style>
        .storage-demo {
            max-width: 650px;
            margin: 0 auto;
        }

        .storage-demo input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #999999;
            border-radius: 6px;
        }

        .demo-button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #111111;
            color: #ffffff;
            cursor: pointer;
        }

        .output-box {
            margin-top: 20px;
            padding: 20px;
            background: #eeeeee;
            border-radius: 8px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">
        <div class="header-inner">

            <a href="../../index.html" class="logo">
                <div class="logo-mark">J</div>
                <div class="logo-text">
                    <span class="logo-title">PRACTICAL LAB</span>
                    <span class="logo-subtitle">HTML • CSS • JavaScript</span>
                </div>
            </a>

            <nav class="desktop-nav">
                <a href="../../index.html">Home</a>
                <a href="../../html/index.html">HTML</a>
                <a href="../../css/index.html">CSS</a>
                <a href="../index.html" class="active">JavaScript</a>
            </nav>

            <button class="menu-button" id="menuButton" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

        <nav class="mobile-nav" id="mobileNav">
            <a href="../../index.html">Home</a>
            <a href="../../html/index.html">HTML Programs</a>
            <a href="../../css/index.html">CSS Programs</a>
            <a href="../index.html">JavaScript Programs</a>
        </nav>
    </div>
</header>

<main class="experiment-wrapper">

    <article class="experiment-card">

        <div class="experiment-header">
            <span class="eyebrow">BROWSER-05</span>
            <h1>localStorage</h1>
            <p>Create a program using localStorage.</p>
        </div>

        <div class="storage-demo">

            <input
                type="text"
                id="nameInput"
                placeholder="Enter your name"
            >

            <button class="demo-button" id="saveButton">
                Save
            </button>

            <button class="demo-button" id="getButton">
                Get Saved Name
            </button>

            <button class="demo-button" id="clearButton">
                Clear
            </button>

            <div class="output-box" id="output">
                Saved data will appear here.
            </div>

        </div>

    </article>

</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-inner">
            <div class="footer-text">
                © 2026 Practical Lab. HTML • CSS • JavaScript
            </div>

            <div class="footer-links">
                <a href="../../index.html">Home</a>
                <a href="../index.html">JavaScript Programs</a>
            </div>
        </div>
    </div>
</footer>

<script>
const menuButton = document.getElementById("menuButton");
const mobileNav = document.getElementById("mobileNav");

menuButton.addEventListener("click", function () {
    mobileNav.classList.toggle("active");

    menuButton.setAttribute(
        "aria-expanded",
        mobileNav.classList.contains("active")
    );
});

const nameInput = document.getElementById("nameInput");
const output = document.getElementById("output");

document.getElementById("saveButton").addEventListener("click", function () {

    const name = nameInput.value.trim();

    if (name === "") {
        output.textContent = "Please enter your name.";
        return;
    }

    localStorage.setItem("studentName", name);

    output.textContent = "Name saved successfully in localStorage.";

});

document.getElementById("getButton").addEventListener("click", function () {

    const savedName = localStorage.getItem("studentName");

    if (savedName === null) {
        output.textContent = "No saved name found.";
    } else {
        output.textContent = "Saved Name: " + savedName;
    }

});

document.getElementById("clearButton").addEventListener("click", function () {

    localStorage.removeItem("studentName");

    nameInput.value = "";
    output.textContent = "Saved data has been cleared.";

});
</script>

</body>
</html>
