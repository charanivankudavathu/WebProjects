<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROWSER-04 | History Object</title>
    <link rel="stylesheet" href="../../styles/main.css">

    <style>
        .browser-demo {
            max-width: 700px;
            margin: 0 auto;
        }

        .demo-button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #111111;
            color: #ffffff;
            cursor: pointer;
        }

        .output-box {
            margin-top: 20px;
            padding: 20px;
            background: #eeeeee;
            border-radius: 8px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">
        <div class="header-inner">

            <a href="../../index.html" class="logo">
                <div class="logo-mark">J</div>
                <div class="logo-text">
                    <span class="logo-title">PRACTICAL LAB</span>
                    <span class="logo-subtitle">HTML • CSS • JavaScript</span>
                </div>
            </a>

            <nav class="desktop-nav">
                <a href="../../index.html">Home</a>
                <a href="../../html/index.html">HTML</a>
                <a href="../../css/index.html">CSS</a>
                <a href="../index.html" class="active">JavaScript</a>
            </nav>

            <button class="menu-button" id="menuButton" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

        <nav class="mobile-nav" id="mobileNav">
            <a href="../../index.html">Home</a>
            <a href="../../html/index.html">HTML Programs</a>
            <a href="../../css/index.html">CSS Programs</a>
            <a href="../index.html">JavaScript Programs</a>
        </nav>
    </div>
</header>

<main class="experiment-wrapper">

    <article class="experiment-card">

        <div class="experiment-header">
            <span class="eyebrow">BROWSER-04</span>
            <h1>History Object</h1>
            <p>Demonstrate the History object.</p>
        </div>

        <div class="browser-demo">

            <button class="demo-button" id="backButton">
                Back
            </button>

            <button class="demo-button" id="forwardButton">
                Forward
            </button>

            <button class="demo-button" id="historyButton">
                Show History Length
            </button>

            <div class="output-box" id="output">
                History information will appear here.
            </div>

        </div>

    </article>

</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-inner">

            <div class="footer-text">
                © 2026 Practical Lab. HTML • CSS • JavaScript
            </div>

            <div class="footer-links">
                <a href="../../index.html">Home</a>
                <a href="../index.html">JavaScript Programs</a>
            </div>

        </div>
    </div>
</footer>

<script>
const menuButton = document.getElementById("menuButton");
const mobileNav = document.getElementById("mobileNav");

menuButton.addEventListener("click", function () {
    mobileNav.classList.toggle("active");

    menuButton.setAttribute(
        "aria-expanded",
        mobileNav.classList.contains("active")
    );
});

document.getElementById("backButton").addEventListener("click", function () {
    history.back();
});

document.getElementById("forwardButton").addEventListener("click", function () {
    history.forward();
});

document.getElementById("historyButton").addEventListener("click", function () {

    document.getElementById("output").innerHTML = `
        <strong>History Object</strong><br><br>
        Number of history entries:
        ${history.length}
    `;

});
</script>

</body>
</html>
